name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Trivy als Container, per Digest festgenagelt (v0.75.0). Bewusst nicht trivy-action: deren Tags
  # wurden im Maerz 2026 kompromittiert (GHSA-69fq-xp46-6x23).
  TRIVY: ghcr.io/aquasecurity/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Ruff
        run: |
          pip install ruff==0.16.8
          ruff check --output-format=github .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript-Syntax
        run: for f in web/static/js/*.js; do node --check "$f"; done
      - name: Shell-Skripte
        run: sh -n web/scripts/vendor.sh
      - name: Compose-Datei
        run: docker compose -f docker-compose.yml -f tests/docker/compose.ci.yml config --quiet

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            web/requirements.txt
            web/requirements-overrides.txt
            requirements-dev.txt
      - name: Systembibliotheken
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libgl1 libglib2.0-0t64 || \
          sudo apt-get install -y -q --no-install-recommends libgl1 libglib2.0-0
      - name: Abhaengigkeiten
        run: |
          pip install -r web/requirements.txt -r requirements-dev.txt
          pip install --no-deps -r web/requirements-overrides.txt
      - name: pytest
        run: pytest -v --durations=10

  trivy-repo:
    name: Trivy (Repo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Datum fuer DB-Cache
        id: date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.date.outputs.day }}
          restore-keys: trivy-db-
      - name: Abhaengigkeiten, Secrets, Dockerfile
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY" \
            fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile .trivyignore --skip-dirs web/node_modules --exit-code 1 .

  docker:
    name: Docker-Image
    needs: [lint, test, trivy-repo]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Image-Name und Version
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/snap2cad" >> "$GITHUB_ENV"   # ghcr.io verlangt Kleinbuchstaben
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Tags und Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Snap2CAD
            org.opencontainers.image.description=Bauteile per Foto vermessen und als STEP/STL nachbauen
            org.opencontainers.image.licenses=MIT

      - name: Image bauen (lokal fuer Tests)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: snap2cad:ci
          build-args: SNAP2CAD_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Datum fuer DB-Cache
        id: date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.date.outputs.day }}
          restore-keys: trivy-db-

      - name: Trivy (Image) – Bericht fuer GitHub Security
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$PWD:/out" "$TRIVY" image --scanners vuln --format sarif --output /out/trivy-image.sarif snap2cad:ci

      - name: Bericht hochladen
        if: always() && hashFiles('trivy-image.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Trivy (Image) – Freigabe nur ohne behebbare HIGH/CRITICAL
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$PWD/.trivyignore:/.trivyignore:ro" "$TRIVY" image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --ignorefile /.trivyignore --exit-code 1 snap2cad:ci

      - name: Stack starten
        env:
          SNAP2CAD_IMAGE: snap2cad:ci
        run: docker compose -f docker-compose.yml -f tests/docker/compose.ci.yml up -d --no-build --wait --wait-timeout 180

      - name: Smoke-Test (Login, PDF, CAD-Auftrag ueber die Sandbox)
        run: python3 tests/docker/smoke_api.py http://127.0.0.1:8000

      - name: Sandbox-Ausbruchstests im Container
        env:
          SNAP2CAD_IMAGE: snap2cad:ci
        run: docker compose -f docker-compose.yml -f tests/docker/compose.ci.yml exec -T app python - < tests/docker/escape_check.py

      - name: Container-Logs bei Fehler
        if: failure()
        env:
          SNAP2CAD_IMAGE: snap2cad:ci
        run: docker compose -f docker-compose.yml -f tests/docker/compose.ci.yml logs --no-color

      - name: Stack beenden
        if: always()
        env:
          SNAP2CAD_IMAGE: snap2cad:ci
        run: docker compose -f docker-compose.yml -f tests/docker/compose.ci.yml down -v

      - name: Bei ghcr.io anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image veroeffentlichen
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: SNAP2CAD_VERSION=${{ env.APP_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
